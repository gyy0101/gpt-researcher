id: industry_competition
name: 行业竞争

objective: >
  根据公司的主要业务，分析各业务所处行业的供给、需求与竞争格局，
  以及公司的竞争优势与竞争劣势，并与主要竞争对手进行对比。

deliverables:
  - id: supply_demand
    title: 分行业供需分析及总结
    description: >
      按公司实际主要业务分别分析所处行业的供给与需求，并给出总结。
      不能预设所有公司都是单一行业；例如宁德时代需要区分动力电池与储能电池，
      不同业务要区分各自的行业需求驱动。
  - id: advantages
    title: 公司竞争优势与劣势
    description: >
      分析公司的竞争优势与竞争劣势。优势不能只是形容词，必须解释
      规模、成本、技术、客户等如何转化为实际经营优势；劣势要结合
      竞争环境与证据说明。
  - id: comparison
    title: 行业及竞争对手比较
    description: >
      将公司与主要竞争对手进行对比，说明公司在行业中的位置与差距，
      以及竞争对手的相关数据。
  - id: tables
    title: 行业数据、增速与同行数据表
    description: >
      用表格整理行业规模、增速与主要竞争对手的关键数据。数据必须
      注明年份与统计口径，口径不一致时要显式标记，无法获取的数据不得编造。

quality_requirements:
  - 重要分析结论必须有证据支撑，并标注来源
  - 不同业务需要区分行业需求驱动，不能把整家公司当成单一行业
  - 不能仅罗列公司优势，必须同时考虑竞争劣势与反向因素
  - 优势必须解释背后的业务机制（如规模如何影响采购、制造成本或客户交付）
  - 表格数据必须注明年份和统计口径，口径不一致时要显式标记
  - 没有数据时不得编造；需区分「已确认不适用」「有数据并已完成研究」「检索不足待补充」「当前无法核实」
  - 不要生成估值、目标价、投资评级等本 Section 不需要的内容
